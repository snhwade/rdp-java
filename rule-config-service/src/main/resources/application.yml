# =============================================================================
# rule-config-service | 本地端口 8082 | 建议第一个启动（Flyway 建表/种子数据）
# IDEA：运行配置「rule-config-service :8082」
# =============================================================================
server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: rule-config-service
  # 本地集成环境：连接本机 MySQL（root/root），库 risk_decision_platform
  datasource:
    url: jdbc:mysql://localhost:3306/risk_decision_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Flyway 自动建表（执行 db/migration/V*.sql）
  flyway:
    enabled: true
    baseline-on-migrate: true
    # 允许乱序迁移：本期 risk-console-redesign 的 V22/V23 版本号低于 decision_flow 阶段已应用的 V24，
    # 开启 out-of-order 使其作为缺失的较低版本补充应用；本期迁移均幂等且仅新增，乱序应用安全。
    out-of-order: true
    locations: classpath:db/migration
  # 第一阶段无 Kafka：配置变更广播失效消息将无法发送，但不应阻断服务启动。
  # 第二阶段启动 Kafka 容器后，广播与引擎本地缓存刷新即生效。
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      properties:
        max.block.ms: 2000          # 无 Kafka 时发送快速失败，不长时间阻塞
        retries: 0

# 结构化规则（rule_v2）条件重复校验开关（R2.x）。
# 默认关闭；开启后保存时若已存在相同编译表达式（compiled_expr）的其它规则，
# 按 block 决定阻止保存（true）或仅放行留作前端提示（false）。
# 后续可由系统配置中心接管该开关。
rule-v2:
  duplicate-condition-check:
    enabled: ${RULE_V2_DUP_CHECK_ENABLED:false}
    block: ${RULE_V2_DUP_CHECK_BLOCK:true}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# JWT 鉴权（R17.1/R17.2）：本服务为令牌签发方（/api/v1/auth/login）。
# 密钥须与各资源服务一致；生产环境务必通过环境变量 SECURITY_JWT_SECRET 覆盖默认值。
security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:rdp-local-dev-secret-key-must-be-long-enough-256bit!!}
    expire-ms: ${SECURITY_JWT_EXPIRE_MS:86400000}

# IDEA 本地启动：控制台输出服务名与端口
logging:
  level:
    root: INFO
    com.riskplatform: INFO
