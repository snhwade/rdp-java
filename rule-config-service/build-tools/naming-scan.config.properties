# 命名中性化扫描配置（后端，risk-console-redesign / Requirement 1.1, 1.3, 1.4）。
#
# 扫描器仅扫描本期（risk-console-redesign）新增的后端代码/资源；旧阶段产出的
# V13-V18 迁移与相关 Java 不在范围内，故不会因历史命名而误报。
# 新增本期子域/资源时，把其路径补充到 scanRoots，并按需调整 minMigrationVersion 即可。

# 厂商专有名词清单（逗号分隔，大小写不敏感匹配；留空则跳过扫描）
vendorTerms=

# 本期新增的显式扫描根（相对 rule-config-service 模块根，逗号分隔）。
scanRoots=

# Flyway 迁移目录：仅纳入版本号 >= minMigrationVersion 的 V 迁移与 seedPrefix 种子脚本。
migrationDir=src/main/resources/db/migration
minMigrationVersion=19
seedPrefix=R__seed_
